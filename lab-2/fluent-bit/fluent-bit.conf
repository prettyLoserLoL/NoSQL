[SERVICE]
    Flush        1
    Log_Level    info
    Parsers_File parsers.conf

[INPUT]
    Name         tail
    Path         /var/log/nginx/access.json.log
    Parser       json
    Tag          nginx.access
    Refresh_Interval 1

[OUTPUT]
    Name            opensearch
    Match           nginx.*
    Host            sofia-os-hot
    Port            9200
    Index           logs
    Type            _doc
    HTTP_User       sofia_writer
    HTTP_Passwd     ${WRITER_PASSWORD}
    tls             On
    tls.verify      Off
    Suppress_Type_Name On
