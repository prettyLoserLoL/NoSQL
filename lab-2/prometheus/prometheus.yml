global:
  scrape_interval: 10s

scrape_configs:
  - job_name: 'opensearch'
    metrics_path: '/_prometheus/metrics'
    scheme: 'https'
    tls_config:
      insecure_skip_verify: true
    basic_auth:
      username: 'sofia_monitor'
      password: '${MONITOR_PASSWORD}'
    static_configs:
      - targets:
          - 'sofia-os-manager:9200'
          - 'sofia-os-hot:9200'
          - 'sofia-os-warm:9200'
