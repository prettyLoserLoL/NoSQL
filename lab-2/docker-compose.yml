services:
  sofia-os-manager:
    build:
      context: .
      dockerfile: opensearch.Dockerfile
      args:
        OPENSEARCH_VERSION: ${OPENSEARCH_VERSION}
    container_name: sofia-os-manager
    environment:
      - node.name=sofia-os-manager
      - node.roles=cluster_manager
      - discovery.seed_hosts=sofia-os-manager,sofia-os-hot,sofia-os-warm
      - cluster.initial_cluster_manager_nodes=sofia-os-manager
      - OPENSEARCH_INITIAL_ADMIN_PASSWORD=${ADMIN_PASSWORD}
      - bootstrap.memory_lock=true
      - "OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m"
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    volumes:
      - ./certs:/usr/share/opensearch/config/certs:ro
      - ./config/opensearch.yml:/usr/share/opensearch/config/opensearch.yml:ro
      - manager_data:/usr/share/opensearch/data
    networks:
      - os-network

  sofia-os-hot:
    build:
      context: .
      dockerfile: opensearch.Dockerfile
      args:
        OPENSEARCH_VERSION: ${OPENSEARCH_VERSION}
    container_name: sofia-os-hot
    environment:
      - node.name=sofia-os-hot
      - node.roles=data,ingest
      - node.attr.temp=hot
      - discovery.seed_hosts=sofia-os-manager,sofia-os-hot,sofia-os-warm
      - cluster.initial_cluster_manager_nodes=sofia-os-manager
      - OPENSEARCH_INITIAL_ADMIN_PASSWORD=${ADMIN_PASSWORD}
      - bootstrap.memory_lock=true
      - "OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m"
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    volumes:
      - ./certs:/usr/share/opensearch/config/certs:ro
      - ./config/opensearch.yml:/usr/share/opensearch/config/opensearch.yml:ro
      - hot_data:/usr/share/opensearch/data
    ports:
      - "9200:9200"
    networks:
      - os-network

  sofia-os-warm:
    build:
      context: .
      dockerfile: opensearch.Dockerfile
      args:
        OPENSEARCH_VERSION: ${OPENSEARCH_VERSION}
    container_name: sofia-os-warm
    environment:
      - node.name=sofia-os-warm
      - node.roles=data
      - node.attr.temp=warm
      - discovery.seed_hosts=sofia-os-manager,sofia-os-hot,sofia-os-warm
      - cluster.initial_cluster_manager_nodes=sofia-os-manager
      - OPENSEARCH_INITIAL_ADMIN_PASSWORD=${ADMIN_PASSWORD}
      - bootstrap.memory_lock=true
      - "OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m"
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    volumes:
      - ./certs:/usr/share/opensearch/config/certs:ro
      - ./config/opensearch.yml:/usr/share/opensearch/config/opensearch.yml:ro
      - warm_data:/usr/share/opensearch/data
    networks:
      - os-network

  sofia-dashboards:
    image: opensearchproject/opensearch-dashboards:${OPENSEARCH_VERSION}
    container_name: sofia-dashboards
    ports:
      - "5601:5601"
    volumes:
      - ./config/dashboards/opensearch_dashboards.yml:/usr/share/opensearch-dashboards/config/opensearch_dashboards.yml:ro
    networks:
      - os-network
    depends_on:
      - sofia-os-manager

  sofia-nginx:
    image: nginx:alpine
    container_name: sofia-nginx
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/html:/usr/share/nginx/html:ro
      - nginx_logs:/var/log/nginx
    networks:
      - os-network

  sofia-fluent-bit:
    image: fluent/fluent-bit:3.0
    container_name: sofia-fluent-bit
    volumes:
      - ./fluent-bit/fluent-bit.conf:/fluent-bit/etc/fluent-bit.conf:ro
      - ./fluent-bit/parsers.conf:/fluent-bit/etc/parsers.conf:ro
      - nginx_logs:/var/log/nginx:ro
    networks:
      - os-network
    depends_on:
      - sofia-nginx
      - sofia-os-hot

  sofia-prometheus:
    image: prom/prometheus:latest
    container_name: sofia-prometheus
    ports:
      - "9091:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    networks:
      - os-network
    depends_on:
      - sofia-os-hot

  sofia-grafana:
    image: grafana/grafana:latest
    container_name: sofia-grafana
    ports:
      - "3002:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD}
    networks:
      - os-network
    depends_on:
      - sofia-prometheus

volumes:
  manager_data:
  hot_data:
  warm_data:
  nginx_logs:

networks:
  os-network:
    driver: bridge
